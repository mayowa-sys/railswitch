name: Engine CI

on:
  push:
    paths:
      - 'services/engine/**'
  pull_request:
    paths:
      - 'services/engine/**'

defaults:
  run:
    working-directory: services/engine

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: railswitch_dev
          POSTGRES_DB: railswitch
          POSTGRES_USER: railswitch
        ports: 
          - "5432:5432"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/engine/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build --if-present
      - run: npm run migration:run
      - run: npm test

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-engine
      cancel-in-progress: false
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ENGINE }}
      - run: |
          MACHINE_ID=$(flyctl machine list -a railswitch-engine --json | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])")
          flyctl machine start $MACHINE_ID -a railswitch-engine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ENGINE }}