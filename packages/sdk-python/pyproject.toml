[project]
name = "railswitch"
version = "0.1.0"
description = "Official Python SDK for RailSwitch — recurring billing recovery"
requires-python = ">=3.12"
dependencies = ["httpx>=0.26.0", "pydantic>=2.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/railswitch"]
