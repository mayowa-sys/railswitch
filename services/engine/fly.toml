app = 'railswitch-engine'
primary_region = 'lhr'

[build]

[experimental]
  auto_rollback = true

[[services]]
  internal_port = 3001
  protocol = 'tcp'
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 3001
    handlers = []

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
